name: Android Production Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type release to deploy production"
        required: true
        type: string

concurrency:
  group: android-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build & deploy prod to Play production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build prod release AAB
        run: ./gradlew :app:bundleProdRelease --stacktrace

      - name: Upload prod AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-prod-release
          path: android/app/build/outputs/bundle/prodRelease/*.aab

      - name: Deploy to Play production track
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "PLAY_STORE_JSON_KEY not configured — skipping Play upload (AAB artifact uploaded above)."
            exit 0
          fi
          echo "$PLAY_STORE_JSON_KEY" > play-store-key.json
          export SUPPLY_JSON_KEY_FILE="$PWD/play-store-key.json"
          bundle exec fastlane android production
