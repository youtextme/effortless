name: Deploy GitHub Pages

# AUTHORITATIVE Pages deployer for effortless (see .github/PAGES-DEPLOY-LAW.md).
# Deploys snack-blog → /snack/ and WordSpark → site root when present.
# Never use force_orphan — that wipes sibling apps on gh-pages.

on:
  push:
    branches: [main]
    paths:
      - "web/snack-blog/**"
      - "wordspark/**"
      - ".github/workflows/github-pages.yml"
      - ".github/PAGES-DEPLOY-LAW.md"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why redeploy (logged in commit message)"
        required: false
        default: "manual redeploy"

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-publish
          fetch-depth: 1

      - name: Assemble and push gh-pages
        env:
          REDEPLOY_REASON: ${{ github.event.inputs.reason || 'push' }}
        run: |
          set -euo pipefail
          cd gh-pages-publish

          # Snack blog → /snack/
          mkdir -p snack
          rsync -a --delete "${{ github.workspace }}/web/snack-blog/" snack/

          # WordSpark → site root (when present on this branch)
          if [ -d "${{ github.workspace }}/wordspark" ]; then
            rsync -a --delete \
              --exclude '.git/' \
              --filter 'protect snack/' \
              --filter 'protect snack/***' \
              "${{ github.workspace }}/wordspark/" ./
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          touch .nojekyll
          git add -A

          if git diff --staged --quiet; then
            echo "No Pages changes to deploy."
            exit 0
          fi

          git commit -m "deploy(pages): snack-blog at /snack/ (${REDEPLOY_REASON})"
          git push origin gh-pages
