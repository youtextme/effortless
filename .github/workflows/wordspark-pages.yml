name: Deploy WordSpark to GitHub Pages

# WordSpark branch deploy — MUST preserve /snack/ (see .github/PAGES-DEPLOY-LAW.md on main).
# Never force_orphan. Clone gh-pages, rsync WordSpark to root excluding snack/, push.

on:
  push:
    branches: [main, cursor/wordspark-vocab-pwa-206f]
    paths:
      - 'wordspark/**'
      - 'platform/**'
      - '.github/workflows/wordspark-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate platform
        run: node platform/scripts/validate-platform.mjs

      - name: Assemble and push gh-pages (preserve /snack/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          WORK="/tmp/gh-pages-work"
          rm -rf "$WORK"

          if git ls-remote --heads "$REPO" gh-pages | grep -q gh-pages; then
            git clone --branch gh-pages --depth 1 "$REPO" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init -b gh-pages
            git -C "$WORK" remote add origin "$REPO"
          fi

          if [ ! -d "$WORK/.git" ]; then
            echo "ERROR: gh-pages worktree is not a git repository after clone/init"
            exit 1
          fi

          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # WordSpark → site root (never delete /snack/)
          rsync -a --delete \
            --exclude snack \
            "${{ github.workspace }}/wordspark/" ./

          touch .nojekyll
          git add -A

          if git diff --staged --quiet; then
            echo "No Pages changes to deploy."
            exit 0
          fi

          git commit -m "deploy(pages): WordSpark at root (preserve /snack/)"
          git push origin gh-pages
