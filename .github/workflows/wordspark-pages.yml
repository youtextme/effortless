name: Deploy WordSpark to GitHub Pages

on:
  push:
    branches: [main, cursor/wordspark-vocab-pwa-206f]
    paths:
      - 'wordspark/**'
      - 'platform/**'
      - '.github/workflows/wordspark-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordspark-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate platform
        run: node platform/scripts/validate-platform.mjs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wordspark
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy WordSpark PWA'
