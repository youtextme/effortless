name: Android CI

on:
  pull_request:
    branches: [main, preprod, develop]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - "cursor/**"
      - "feature/**"
      - develop
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & unit tests (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint dev debug
        run: ./gradlew :app:lintDevDebug --stacktrace

      - name: Unit tests (dev debug)
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

  build-matrix:
    name: Build ${{ matrix.flavor }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            build_type: Debug
          - flavor: preprod
            build_type: Debug
          - flavor: prod
            build_type: Debug
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble APK
        run: ./gradlew :app:assemble${{ matrix.flavor }}${{ matrix.build_type }} --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.build_type }}
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build_type }}/*.apk
