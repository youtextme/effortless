<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Read topics that matter. Understand the world. Enjoy reading.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>WordSpark</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="reading-header" class="reading-header" data-speech-skip>
      <button id="btn-home" class="btn-home" aria-label="Home" type="button" data-speech-skip>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btn-install-header" class="btn-install-header" type="button" aria-label="Install WordSpark app" data-speech-skip>Install</button>
    </header>

    <main class="reading-main" id="reading-scroll" data-speech-surface>
      <p id="passage-theme" class="passage-theme"></p>
      <div class="passage-title-row">
        <h1 id="passage-title" class="passage-h1"></h1>
      </div>
      <div class="passage-scroll-wrap" id="passage-scroll-wrap">
        <article id="passage-content" class="passage"></article>
        <div id="scroll-fade" class="scroll-fade" aria-hidden="true" data-speech-skip></div>
      </div>
      <div id="scroll-sentinel" class="scroll-sentinel" aria-hidden="true" data-speech-skip></div>
    </main>

    <button id="btn-listen" class="listen-dock" type="button" aria-label="Listen to this page" aria-pressed="false" data-speech-skip>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/>
        <path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>

    <button id="btn-done-reading" class="fab" disabled aria-label="Continue" data-speech-skip>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <section id="screen-quiz" class="overlay" hidden data-speech-surface>
      <div class="quiz-container">
        <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-progress-bar"></div></div>
        <p class="quiz-counter" id="quiz-counter"></p>
        <h2 id="quiz-question" class="quiz-question"></h2>
        <div id="quiz-choices" class="quiz-choices" data-speech-skip></div>
        <div id="quiz-coach" class="quiz-coach" hidden aria-live="polite">
          <p id="quiz-coach-text" class="quiz-coach-text"></p>
        </div>
      </div>
    </section>

    <section id="screen-complete" class="overlay" hidden data-speech-surface>
      <div class="complete-container">
        <h2>Well done!</h2>
        <p id="complete-msg"></p>
        <div id="cert-preview" class="cert-preview"></div>
        <button id="btn-share-complete" class="btn-primary">Share certificate</button>
        <button id="btn-next-passage" class="btn-text">Keep reading</button>
      </div>
    </section>
  </div>

  <div id="name-modal" class="modal" hidden data-speech-surface>
    <div class="modal-panel">
      <h2>Welcome to WordSpark</h2>
      <p>What's your name?</p>
      <input type="text" id="child-name" placeholder="Your name" maxlength="30" autocomplete="name">
      <button id="btn-save-name" class="btn-primary">Let's read</button>
    </div>
  </div>

  <div id="word-sheet" class="word-sheet" hidden data-speech-surface>
    <div class="word-sheet-backdrop" id="word-sheet-backdrop"></div>
    <div class="word-sheet-panel">
      <h3 id="sheet-word" class="sheet-word"></h3>
      <p id="sheet-intro" class="sheet-intro" hidden></p>
      <div id="sheet-scenarios" class="sheet-scenarios"></div>
    </div>
  </div>

  <footer id="parent-footer" class="parent-footer" data-speech-skip>
    <button id="btn-parent-toggle" class="parent-toggle">Parents</button>
    <div id="parent-panel" class="parent-panel" hidden>
      <span id="parent-progress" class="parent-stat"></span>
      <div class="parent-pace" role="group" aria-label="Read-aloud speed">
        <span class="parent-pace-label">Speech speed</span>
        <button type="button" class="parent-pace-btn" data-pace="gentle">Gentle</button>
        <button type="button" class="parent-pace-btn" data-pace="home">Home</button>
        <button type="button" class="parent-pace-btn" data-pace="brisk">Brisk</button>
        <button type="button" class="parent-pace-btn" data-pace="quick">Quick</button>
      </div>
      <p id="parent-voice-name" class="parent-voice-name"></p>
      <button class="parent-link" type="button" data-action="install" id="btn-install-parent">Install app</button>
      <button class="parent-link" data-action="certificates">Certificates</button>
      <button class="parent-link parent-danger" data-action="refresh">Reset</button>
    </div>
  </footer>

  <section id="screen-home" class="overlay home-screen" hidden data-speech-surface>
    <div class="home-shell">
      <header class="home-header">
        <button id="btn-home-close" class="icon-btn" type="button" aria-label="Back to reading">←</button>
        <h2>Home</h2>
      </header>
      <nav class="home-tabs" role="tablist" aria-label="Home">
        <button type="button" class="home-tab" role="tab" id="tab-words" data-home-tab="words" aria-controls="home-tab-words" aria-selected="false">Words</button>
        <button type="button" class="home-tab is-active" role="tab" id="tab-passages" data-home-tab="passages" aria-controls="home-tab-passages" aria-selected="true">Passages</button>
        <button type="button" class="home-tab" role="tab" id="tab-settings" data-home-tab="settings" aria-controls="home-tab-settings" aria-selected="false">Settings</button>
      </nav>

      <div id="home-tab-words" class="home-panel" role="tabpanel" data-home-panel="words" aria-labelledby="tab-words" hidden>
        <div id="words-list" class="words-list" data-catalog="words"></div>
      </div>
      <div id="home-tab-passages" class="home-panel" role="tabpanel" data-home-panel="passages" aria-labelledby="tab-passages">
        <div id="passage-list" class="passage-list" data-catalog="passages"></div>
      </div>
      <div id="home-tab-settings" class="home-panel" role="tabpanel" data-home-panel="settings" aria-labelledby="tab-settings" hidden>
        <div class="home-field">
          <label for="settings-child-name">Your name</label>
          <input type="text" id="settings-child-name" maxlength="30" autocomplete="name" placeholder="Your name">
          <button id="btn-save-settings-name" class="btn-primary" type="button">Save name</button>
        </div>
        <div class="home-field">
          <p class="home-label">Speech speed</p>
          <div class="parent-pace home-pace" role="group" aria-label="Read-aloud speed">
            <button type="button" class="parent-pace-btn" data-pace="gentle">Gentle</button>
            <button type="button" class="parent-pace-btn" data-pace="home">Home</button>
            <button type="button" class="parent-pace-btn" data-pace="brisk">Brisk</button>
            <button type="button" class="parent-pace-btn" data-pace="quick">Quick</button>
          </div>
          <p id="settings-voice-name" class="parent-voice-name"></p>
        </div>
        <div class="home-field home-install">
          <p class="home-label">Install app</p>
          <p id="install-copy" class="home-install-copy"></p>
          <button class="btn-primary" type="button" id="btn-install">Install app</button>
        </div>
        <div class="home-field">
          <button class="parent-link" type="button" id="btn-settings-certs">Certificates</button>
        </div>
      </div>
    </div>
  </section>

  <section id="panel-certificates" class="sub-panel" hidden data-speech-surface>
    <header class="sub-header">
      <button class="icon-btn btn-back-panel" data-back>←</button>
      <h2>Certificates</h2>
    </header>
    <div id="certs-gallery" class="certs-gallery"></div>
    <p id="certs-empty" class="empty-state" hidden>No certificates yet.</p>
  </section>

  <div id="refresh-modal" class="modal" hidden>
    <div class="modal-panel">
      <h2>Reset all progress?</h2>
      <p class="modal-warning">All progress will be lost forever.</p>
      <p class="modal-hint">Password hint: jbomb bday</p>
      <input type="password" id="refresh-password" placeholder="Enter password" inputmode="numeric">
      <button id="btn-confirm-refresh" class="btn-danger">Reset everything</button>
      <button id="btn-cancel-refresh" class="btn-text">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
