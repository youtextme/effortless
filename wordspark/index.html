<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Read topics that matter. Understand the world. Enjoy reading.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>WordSpark</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main class="reading-main" id="reading-scroll">
      <h1 id="passage-title" class="passage-h1"></h1>
      <article id="passage-content" class="passage"></article>
      <div id="scroll-sentinel" class="scroll-sentinel" aria-hidden="true"></div>
    </main>

    <button id="btn-done-reading" class="fab" disabled aria-label="Continue">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <section id="screen-quiz" class="overlay" hidden>
      <div class="quiz-container">
        <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-progress-bar"></div></div>
        <p class="quiz-counter" id="quiz-counter"></p>
        <h2 id="quiz-question" class="quiz-question"></h2>
        <div id="quiz-choices" class="quiz-choices"></div>
      </div>
    </section>

    <section id="screen-complete" class="overlay" hidden>
      <div class="complete-container">
        <h2>Well done!</h2>
        <p id="complete-msg"></p>
        <div id="cert-preview" class="cert-preview"></div>
        <button id="btn-share-complete" class="btn-primary">Share certificate</button>
        <button id="btn-next-passage" class="btn-text">Keep reading</button>
      </div>
    </section>
  </div>

  <div id="name-modal" class="modal" hidden>
    <div class="modal-panel">
      <h2>Welcome to WordSpark</h2>
      <p>What's your name?</p>
      <input type="text" id="child-name" placeholder="Your name" maxlength="30" autocomplete="name">
      <button id="btn-save-name" class="btn-primary">Let's read</button>
    </div>
  </div>

  <div id="word-sheet" class="word-sheet" hidden>
    <div class="word-sheet-backdrop" id="word-sheet-backdrop"></div>
    <div class="word-sheet-panel">
      <h3 id="sheet-word" class="sheet-word"></h3>
      <p id="sheet-intro" class="sheet-intro" hidden></p>
      <div id="sheet-scenarios" class="sheet-scenarios"></div>
    </div>
  </div>

  <footer id="parent-footer" class="parent-footer">
    <button id="btn-parent-toggle" class="parent-toggle">Parents</button>
    <div id="parent-panel" class="parent-panel" hidden>
      <span id="parent-progress" class="parent-stat"></span>
      <button class="parent-link" data-action="passages">Topics</button>
      <button class="parent-link" data-action="words">Words</button>
      <button class="parent-link" data-action="certificates">Certificates</button>
      <button class="parent-link" data-action="install" id="btn-install" hidden>Install</button>
      <button class="parent-link parent-danger" data-action="refresh">Reset</button>
    </div>
  </footer>

  <section id="panel-passages" class="sub-panel" hidden>
    <header class="sub-header">
      <button class="icon-btn btn-back-panel" data-back>←</button>
      <h2>Topics</h2>
    </header>
    <div id="passage-list" class="passage-list"></div>
  </section>

  <section id="panel-words" class="sub-panel" hidden>
    <header class="sub-header">
      <button class="icon-btn btn-back-panel" data-back>←</button>
      <h2>Words</h2>
    </header>
    <div id="words-list" class="words-list"></div>
  </section>

  <section id="panel-certificates" class="sub-panel" hidden>
    <header class="sub-header">
      <button class="icon-btn btn-back-panel" data-back>←</button>
      <h2>Certificates</h2>
    </header>
    <div id="certs-gallery" class="certs-gallery"></div>
    <p id="certs-empty" class="empty-state" hidden>No certificates yet.</p>
  </section>

  <div id="refresh-modal" class="modal" hidden>
    <div class="modal-panel">
      <h2>Reset all progress?</h2>
      <p class="modal-warning">All progress will be lost forever.</p>
      <p class="modal-hint">Password hint: jbomb bday</p>
      <input type="password" id="refresh-password" placeholder="Enter password" inputmode="numeric">
      <button id="btn-confirm-refresh" class="btn-danger">Reset everything</button>
      <button id="btn-cancel-refresh" class="btn-text">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
